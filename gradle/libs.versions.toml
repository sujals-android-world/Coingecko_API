hilt = ["hilt-android"]
retrofit = ["retrofit-core", "retrofit-converter-gson"]
coil = ["coil-compose"]
datastore = ["androidx-datastore-preferences"]
unitTest = ["junit", "androidx-junit", "androidx-espresso-core", "kotlinx-coroutines-test", "mockito-inline", "junit-jupiter"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-symbol-processing = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }




